# CI：analyze + 非 golden 测试。golden 依赖 Windows 基准环境的字体渲染，
# 在 Linux 上跑会假红，所以留在本地（@Tags(['golden']) 排除）。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      # pub.dev 对 GitHub runner 的 IP 偶发 429 限流：重试 + 强制锁文件。
      # 失败时把日志末尾写进 Step Summary（公开页可读，匿名诊断不用管理员权限）。
      - name: flutter pub get
        run: |
          set +e
          for i in 1 2 3; do
            flutter pub get --enforce-lockfile > pubget.log 2>&1
            if [ $? -eq 0 ]; then exit 0; fi
            echo "::warning::pub get 第 $i 次失败，15 秒后重试"
            sleep 15
          done
          {
            echo '### flutter pub get 失败诊断'
            echo '```'
            tail -60 pubget.log
            echo '```'
            flutter --version
            dart --version
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # 失败时把 pubget.log 全文开成公开 issue：日志 API 要管理员权限，
      # issue 匿名可读，诊断不需要用户手动贴日志。
      - name: upload diagnostics
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const log = fs.existsSync('pubget.log')
              ? fs.readFileSync('pubget.log', 'utf8').slice(-6000)
              : '(pubget.log 不存在)';
            let fv = '';
            try { fv = execSync('flutter --version').toString(); } catch (e) { fv = 'flutter --version 失败: ' + e.message; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI 诊断 pub get 失败 ${context.sha.slice(0, 7)}（自动创建）`,
              body: '```\n' + log + '\n```\n\n```\n' + fv + '\n```\n诊断用，阅后可删。'
            });
      - run: flutter analyze
      # --concurrency=1：套件串行，避开 Windows 本机偶发的测试挂起竞态。
      - run: flutter test --exclude-tags=golden --concurrency=1
