# CI：analyze + 非 golden 测试。golden 依赖 Windows 基准环境的字体渲染，
# 在 Linux 上跑会假红，所以留在本地（@Tags(['golden']) 排除）。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      # pub.dev 对 GitHub runner 的 IP 偶发 429 限流：重试 + 强制锁文件。
      - name: flutter pub get
        run: |
          n=0
          until flutter pub get --enforce-lockfile; do
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            echo "::warning::pub get 第 $n 次失败，15 秒后重试"
            sleep 15
          done
      - run: flutter analyze
      # --concurrency=1：套件串行，避开 Windows 本机偶发的测试挂起竞态。
      - run: flutter test --exclude-tags=golden --concurrency=1
